[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcvt"
version = "0.2.2"
description = "QICK pulse schedule visualizer and state edge-matrix exporter for asm_v2 programs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Dhilan", email = "dhilannag5@gmail.com" }]
keywords = ["qick", "rfsoc", "quantum", "pulse", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.20",
]

[project.optional-dependencies]
qick = ["qick"]
pickle = ["cloudpickle>=2.0"]
dev = ["pytest>=7", "qick", "cloudpickle>=2.0"]

[project.urls]
Homepage = "https://github.com/DRNag2/QCVT"
Repository = "https://github.com/DRNag2/QCVT"
Documentation = "https://github.com/DRNag2/QCVT#readme"
Issues = "https://github.com/DRNag2/QCVT/issues"

[project.scripts]
qcvt = "qcvt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
