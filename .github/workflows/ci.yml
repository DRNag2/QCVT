name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        qick-version: ["0.2.388", "0.2.406", "0.2.422"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and qick ${{ matrix.qick-version }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "qick==${{ matrix.qick-version }}"

      - name: Show versions
        run: |
          python -c "import qick, qcvt; print('qick', qick.__version__); print('qcvt', qcvt.__version__)"

      - name: Run tests
        run: pytest tests/ -v
